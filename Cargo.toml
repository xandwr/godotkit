[package]
name = "gdkit"
version = "0.1.0"
edition = "2024"
description = "A lightweight Rust utility belt for Godot."

[dependencies]
anstream = "1.0"
ignore = "0.4"
clap = { version = "4.6.6", features = ["derive"] }
gdview = { git = "https://github.com/xandwr/gdview", rev = "da0853ca53a3388ac1e5caebe72f893d8c21f790" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.8"
pathdiff = "0.2"
