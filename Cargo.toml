[package]
name = "gdkit"
version = "0.1.0"
edition = "2024"
description = "A lightweight Rust utility belt for Godot."

[dependencies]
anstream = "1.0"
clap = { version = "4.6.6", features = ["derive"] }
gdview = { git = "https://github.com/xandwr/gdview", rev = "8899766f62e38fcc24466da07a17324cd2642bf4" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.8"
pathdiff = "0.2"
